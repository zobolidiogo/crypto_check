{% extends "layout.html" %}

{% block title %}Registrar{% endblock %}

{% block content %}
    <form action="/register" method="post">
        {% if mensagem %}
            <p class="form-error"><i class="bi bi-exclamation-circle"></i> {{ mensagem }}</p>
            <br>
        {% endif %}
        <div>
            <input autocomplete="off" autofocus name="nome_display" placeholder="como gostaria de ser chamado?" type="text" value="{{ nome_display if nome_display else '' }}">
        </div>
        <div>
            <input autocomplete="off" autofocus name="usuario" placeholder="nome de usuário" type="text" value="{{ usuario if usuario else '' }}"><a class="form-error"> *</a>
        </div>
        <div>
            <input autocomplete="off" autofocus name="email" placeholder="digite seu email" type="text" value="{{ email if email else '' }}"><a class="form-error"> *</a>
        </div>
        <div>
            <input name="senha" placeholder="digite sua senha" type="password"><a class="form-error"> *</a>
        </div>
        <div>
            <input name="confirmacao" placeholder="confirme sua senha" type="password"><a class="form-error"> *</a>
        </div>

        <button type="submit">Registrar</button>
    </form>
    <br>
    <p>Já tem uma conta? <a href="/login" class="ask-link">Faça login</a></p>
{% endblock %}
